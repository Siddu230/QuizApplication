<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <h1 class="login-title">Login Here! To take QUIZ</h1>
        <form action="index.html" method="get" id="loginForm">
            <div class="input-group">
                <label for="username" class="input-label">Enter your Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password" class="input-label">Enter your Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <p class="signup-link">New user? <a href="signup.html">Sign up here</a></p>
    </div>
</body>
</html>
